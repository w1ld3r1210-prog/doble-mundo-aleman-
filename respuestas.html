<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Respuestas — Doble Mundo Alemán</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --negro: #111111;
      --rojo: #e30613;
      --amarillo: #ffcc00;
      --texto: #1a202c;
      --subtexto: #4a5568;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background-color: var(--bg);
      color: var(--texto);
      padding: 30px 20px;
    }
    .header {
      max-width: 1000px;
      margin: 0 auto 30px auto;
      background: var(--negro);
      color: #fff;
      padding: 20px 30px;
      border-radius: 12px;
      border-bottom: 4px solid var(--amarillo);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header h1 {
      font-size: 1.5rem;
      color: var(--amarillo);
    }
    .btn-volver {
      background: var(--rojo);
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.3s;
    }
    .btn-volver:hover { background: #b8040f; }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      flex: 1;
      border-left: 5px solid var(--rojo);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .stat-num { font-size: 1.8rem; font-weight: bold; color: var(--negro); }
    .stat-label { font-size: 0.85rem; color: var(--subtexto); text-transform: uppercase; }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-borrar-todo {
      background: transparent;
      border: 1px solid var(--rojo);
      color: var(--rojo);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .btn-borrar-todo:hover { background: var(--rojo); color: #fff; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }
    th, td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid #edf2f7;
      font-size: 0.9rem;
    }
    th {
      background: #111;
      color: var(--amarillo);
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    tr:hover { background: #f8fafc; }
    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #edf2f7;
      color: #2d3748;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      background: var(--card-bg);
      border-radius: 10px;
      color: var(--subtexto);
    }
    .btn-eliminar {
      color: var(--rojo);
      cursor: pointer;
      border: none;
      background: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Doble Mundo Alemán</h1>
      <p style="font-size:0.85rem; color:#ccc;">Panel Interno de Registro de Mensajes</p>
    </div>
    <a href="index.html" class="btn-volver">← Volver al Sitio Web</a>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="totalMsg">0</div>
        <div class="stat-label">Total Respuestas</div>
      </div>
    </div>

    <div class="actions">
      <h2 style="font-size: 1.2rem;">Solicitudes Recibidas</h2>
      <button class="btn-borrar-todo" onclick="borrarTodas()">Borrar Todas</button>
    </div>

    <div id="tablaContainer"></div>
  </div>

  <script>
    function cargarRespuestas() {
      const respuestas = JSON.parse(localStorage.getItem('respuestasFormulario') || '[]');
      document.getElementById('totalMsg').textContent = respuestas.length;
      const container = document.getElementById('tablaContainer');

      if (respuestas.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No hay mensajes registrados aún</h3>
            <p style="margin-top:8px;">Las solicitudes enviadas desde el formulario aparecerán automáticamente aquí.</p>
          </div>
        `;
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Asunto / Acción</th>
              <th>Mensaje</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
      `;

      respuestas.forEach((item, index) => {
        html += `
          <tr>
            <td style="white-space:nowrap; color:#718096; font-size:0.8rem;">${item.fecha}</td>
            <td><strong>${item.nombre}</strong></td>
            <td><a href="mailto:${item.correo}" style="color:#2b6cb0;">${item.correo}</a></td>
            <td><span class="tag">${item.asunto}</span></td>
            <td>${item.mensaje || '<em>Sin mensaje adicional</em>'}</td>
            <td><button class="btn-eliminar" onclick="borrarItem(${index})">✕</button></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function borrarItem(index) {
      if (confirm('¿Deseas eliminar este registro?')) {
        let respuestas = JSON.parse(localStorage.getItem('respuestasFormulario') || '[]');
        respuestas.splice(index, 1);
        localStorage.setItem('respuestasFormulario', JSON.stringify(respuestas));
        cargarRespuestas();
      }
    }

    function borrarTodas() {
      if (confirm('¿Estás seguro de que deseas borrar TODAS las respuestas?')) {
        localStorage.removeItem('respuestasFormulario');
        cargarRespuestas();
      }
    }

    window.onload = cargarRespuestas;
  </script>
</body>
</html>
